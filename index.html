            vizData = vizAnalysers.map(an => new Uint8Array(an.frequencyBinCount));
            vizBinMap = null;
            return true;
        }

        function resumeAudioCtx() {
            if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
        }

        function attachVisualizer(audio) {
            try {
                if (!ensureAudioGraph()) return;
                const node = audioCtx.createMediaElementSource(audio);
                node.connect(audioCtx.destination);   // suara tetap keluar seperti biasa
                node.connect(vizBus);                 // dan dicabangkan ke analyser kiri / kanan
                audio._vizNode = node;
                resumeAudioCtx();
            } catch (e) { console.warn('Visualizer tidak aktif:', e); }
        }

        function detachVisualizer(audio) {
            try {
                if (audio && audio._vizNode) { audio._vizNode.disconnect(); audio._vizNode = null; }
            } catch (e) {}
        }

        // Peta bar -> rentang bin FFT, skala logaritmik 40 Hz - 16 kHz
        function buildVizBinMap() {
            const an = vizAnalysers[0];
            const hz = audioCtx.sampleRate / an.fftSize;
            const fMin = 40, fMax = Math.min(16000, audioCtx.sampleRate / 2);
            const map = [];
            for (let i = 0; i < VIZ_BARS; i++) {
                const lo = fMin * Math.pow(fMax / fMin, i / VIZ_BARS);
                const hi = fMin * Math.pow(fMax / fMin, (i + 1) / VIZ_BARS);
                let a = Math.max(0, Math.min(an.frequencyBinCount - 1, Math.floor(lo / hz)));
                let b = Math.max(a + 1, Math.min(an.frequencyBinCount, Math.ceil(hi / hz)));
                map.push([a, b]);
            }
            return map;
        }

        // Perbarui level bar; mengembalikan total energi (untuk menghentikan animasi saat sepi)
        function updateVizLevels() {
            let energy = 0;
            const live = audioCtx && vizAnalysers.length === 2;
            if (live && !vizBinMap) vizBinMap = buildVizBinMap();
            for (let ch = 0; ch < 2; ch++) {
                if (live) vizAnalysers[ch].getByteFrequencyData(vizData[ch]);
                for (let i = 0; i < VIZ_BARS; i++) {
                    let target = 0;
                    if (live) {
                        const [a, b] = vizBinMap[i];
                        let m = 0;
                        for (let k = a; k < b; k++) if (vizData[ch][k] > m) m = vizData[ch][k];
                        target = Math.min(1, (m / 255) * (0.9 + 0.5 * i / VIZ_BARS));   // sedikit dongkrak frekuensi tinggi
                    }
                    const lvl = vizLevels[ch][i];
                    vizLevels[ch][i] = target > lvl ? target : Math.max(target, lvl - 0.04);   // naik cepat, turun halus
                    vizPeaks[ch][i] = Math.max(vizLevels[ch][i], vizPeaks[ch][i] - 0.012);    // penanda puncak
                    energy += vizLevels[ch][i] + vizPeaks[ch][i];
                }
            }
            return energy;
        }

        function drawViz() {
            const canvas = document.getElementById('viz-canvas');
            if (!canvas) return;
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.clientWidth, h = canvas.clientHeight;
            if (!w || !h) return;
            const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
            if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            const labelW = 14, rowGap = 6, side = vizSide, colGap = 20;
            const rowH = side ? h : (h - rowGap) / 2;
            const colW = side ? (w - colGap) / 2 : w;
            const gx = side ? 0 : labelW + 6, gw = colW - gx;
            const bw = gw / VIZ_BARS, pad = Math.min(2, bw * 0.3);

            ['L', 'R'].forEach((name, ch) => {
                const y0 = side ? 0 : ch * (rowH + rowGap);
                const xo = side ? ch * (colW + colGap) : 0;
                ctx.fillStyle = '#94a3b8';
                ctx.font = '600 11px "Segoe UI", system-ui, sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText(name, xo + (side ? 4 : 0), side ? y0 + 10 : y0 + rowH / 2);

                const grad = ctx.createLinearGradient(0, y0 + rowH, 0, y0);
                grad.addColorStop(0, '#10b981');
                grad.addColorStop(0.7, '#10b981');
                grad.addColorStop(0.88, '#fbbf24');
                grad.addColorStop(1, '#ef4444');

                for (let i = 0; i < VIZ_BARS; i++) {
                    const x = xo + gx + i * bw;
                    const lvl = vizLevels[ch][i];
                    const bh = Math.max(2, lvl * rowH);
                    ctx.fillStyle = 'rgba(255,255,255,0.05)';
                    ctx.fillRect(x, y0, bw - pad, rowH);
                    ctx.globalAlpha = lvl < 0.01 ? 0.35 : 1;
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, y0 + rowH - bh, bw - pad, bh);
                    ctx.globalAlpha = 1;
                    const pk = vizPeaks[ch][i];
                    if (pk > 0.03) {
                        ctx.fillStyle = 'rgba(248,250,252,0.85)';
                        ctx.fillRect(x, Math.max(y0, y0 + rowH - pk * rowH - 1.5), bw - pad, 1.5);
                    }
                }
            });
        }

        function vizTick() {
            const energy = updateVizLevels();
            drawViz();
            const playing = !!activeAudioElement && !activeAudioElement.paused;
            if (energy > 0.01 || playing) requestAnimationFrame(vizTick);
            else vizRunning = false;   // sepi: berhenti menggambar sampai ada audio diputar lagi
        }

        function startViz() {
            if (vizRunning) return;
            vizRunning = true;
            requestAnimationFrame(vizTick);
        }

        window.addEventListener('resize', () => { if (!vizRunning) drawViz(); });
        drawViz();   // gambar keadaan awal (bar diam)

        // Lanjutkan audio aktif yang sedang dijeda (atau sedang fade-out) dengan fade masuk.
        // Mengembalikan true jika ada audio yang dilanjutkan.
        function fadeResumeActiveAudio() {
            const cur = activeAudioElement;
            if (!cur || !(cur.paused || cur.isFadingOut)) return false;
            const fadeMs = parseFloat(document.getElementById('fade-slider').value) * 1000;
            cur.isFadingOut = false;
            cur.isFadingOutEnd = false; // izinkan fade-out akhir dihitung ulang setelah dilanjutkan
            if (cur.paused) cur.play().catch(e => console.error(e));
            smoothFade(cur, 1, fadeMs);
            resumeAudioCtx();
            startViz();
            return true;
        }

        // --- Tombol Matikan Semua / Nyalakan Kembali ---
        function updateOffAllButton() {
            const btn = document.getElementById('off-all-btn');
            if (!btn) return;
            if (offAllSnapshot) {
                btn.className = 'btn btn-success';
                btn.title = 'Tampilkan lagi latar terakhir dan lanjutkan suara latar terakhir';
                btn.innerHTML = `<svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg> Nyalakan Kembali`;
            } else {
                btn.className = 'btn btn-danger';
                btn.title = 'Blackout seluruh layar dan jeda suara latar (dengan fade keluar)';
                btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg> Matikan Semua`;
            }
        }

        // Kembali ke mode "Matikan Semua" (dipanggil saat latar/suara dinyalakan manual)
        function clearOffAll() {
            if (!offAllSnapshot) return;
            offAllSnapshot = null;
            updateOffAllButton();
        }

        // Jika file yang tersimpan di snapshot dihapus, lupakan; bila tak ada yang tersisa, kembali ke "Matikan Semua"
        function forgetInOffAll(kind, id) {
            if (!offAllSnapshot) return;
            if (kind === 'bg' && offAllSnapshot.bgId === id) offAllSnapshot.bgId = null;
            if (kind === 'audio' && offAllSnapshot.audioId === id) offAllSnapshot.audioId = null;
            if (!offAllSnapshot.bgId && !offAllSnapshot.audioId) clearOffAll();
        }

        // Mode "Nyalakan Kembali": tampilkan lagi latar terakhir dan lanjutkan suara latar terakhir secara bersamaan
        function restoreAll() {
            const snap = offAllSnapshot;
            offAllSnapshot = null;
            updateOffAllButton();
            if (!snap) return;

            if (snap.bgId && activeBgId === snap.bgId && isBlackout && backgrounds.some(b => b.id === snap.bgId)) {
                isBlackout = false;
                syncScreens();          // memakai animasi "Saat tampil"
                renderBackgrounds();
                saveSettings();
            }
            if (snap.audioId && playingAudioId === snap.audioId && backsounds.some(a => a.id === snap.audioId)) {
                if (fadeResumeActiveAudio()) renderAudios();   // dilanjutkan dari posisi terakhir dengan fade masuk
            }
        }

        // Matikan Semua: blackout seluruh layar (preview + proyektor) memakai animasi "Saat dimatikan",
        // dan jeda suara latar dengan fade keluar. Latar & lagu terakhir tetap bertanda hijau.
        // Setelah itu tombol berubah jadi "Nyalakan Kembali"; menekannya mengembalikan keadaan tadi.
        window.turnOffAll = function() {
            if (offAllSnapshot) { restoreAll(); return; }

            const snap = { bgId: null, audioId: null };
            if (activeBgId && !isBlackout) {
                snap.bgId = activeBgId;
                isBlackout = true;
                syncScreens();
                renderBackgrounds();
                saveSettings();
            }
            const audioId = playingAudioId;
            if (fadePauseActiveAudio()) {
                snap.audioId = audioId;
                renderAudios();
            }
            // Hanya masuk mode "Nyalakan Kembali" jika memang ada yang dimatikan
            if (snap.bgId || snap.audioId) {
                offAllSnapshot = snap;
                updateOffAllButton();
            }
        };

        window.toggleAudio = function(id, url) {
            const fadeSecs = parseFloat(document.getElementById('fade-slider').value);
            const fadeMs = fadeSecs * 1000;

            if (playingAudioId === id) {
                // Toggle untuk audio yang sama dengan Fade
                if (activeAudioElement.paused || activeAudioElement.isFadingOut) {
                    fadeResumeActiveAudio();
                    clearOffAll();   // suara dinyalakan manual -> tombol kembali jadi "Matikan Semua"
                } else {
                    fadePauseActiveAudio();
                }
            } else {
                // Crossfade jika berpindah audio
                if (activeAudioElement && !activeAudioElement.paused) {
                    const oldAudio = activeAudioElement;
                    oldAudio.isFadingOut = true;
                    smoothFade(oldAudio, 0, fadeMs, () => {
                        oldAudio.pause();
                        detachVisualizer(oldAudio);
                        oldAudio.src = '';
                    });
                } else if (activeAudioElement) {
                    detachVisualizer(activeAudioElement);   // audio lama yang sudah berhenti / dijeda
                }
                
                const audio = new Audio(url);
                activeAudioElement = audio;
                attachVisualizer(audio);
                const trackData = backsounds.find(b => b.id === id);
                audio.loop = trackData ? trackData.loop : false;
                
                // Semua handler memakai elemen "audio" miliknya sendiri (bukan activeAudioElement global)
                // dan diabaikan jika elemen ini sudah bukan yang aktif (mis. sedang crossfade keluar).
                audio.ontimeupdate = () => {
                    if (activeAudioElement !== audio) return;
                    updateSeeker(id);
                    // Antisipasi fade-out di akhir durasi
                    const remain = audio.duration - audio.currentTime;
                    if (!audio.loop && remain <= fadeSecs && remain > 0.1 && !audio.isFadingOutEnd) {
                        audio.isFadingOutEnd = true;
                        smoothFade(audio, 0, fadeSecs * 1000, null);
                    }
                };
                
                audio.onended = () => {
                    if (activeAudioElement !== audio) return;
                    if (!audio.loop) {
                        playingAudioId = null;
                        renderAudios();
                    }
                };
                
                audio.volume = 0;
                audio.play().catch(e => console.error(e));
                smoothFade(audio, 1, fadeMs);
                startViz();
                
                playingAudioId = id;
                lastAudioId = id;
                clearOffAll();   // suara dinyalakan manual -> tombol kembali jadi "Matikan Semua"
                saveSettings();
            }
            renderAudios();
        };

        window.deleteAudio = async function(id) {
            const target = backsounds.find(a => a.id === id);
            if (!target) return;
            const ok = await showConfirm({
                title: 'Hapus suara latar?',
                name: target.name,
                text: 'akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.',
                note: playingAudioId === id ? 'Suara ini sedang diputar dan akan langsung dihentikan.' : ''
            });
            if (!ok) return;
            forgetInOffAll('audio', id);
            const index = backsounds.findIndex(a => a.id === id);
            if (index > -1) {
                if (playingAudioId === id && activeAudioElement) {
                    activeAudioElement.pause();
                    detachVisualizer(activeAudioElement);
                    activeAudioElement = null;
                    playingAudioId = null;
                }
                if (lastAudioId === id) { lastAudioId = null; saveSettings(); }
                URL.revokeObjectURL(backsounds[index].url);
                await deleteMediaDB(id);
                backsounds.splice(index, 1);
                renderAudios();
            }
        };

        function renderAudios() {
            renameBlurSuspended = true;
            backsounds.sort(sortByName);
            const list = document.getElementById('audio-list');
            list.innerHTML = backsounds.length === 0 ? '<div class="empty-state" style="padding:20px; font-size:0.9rem;">Belum ada suara latar</div>' : '';

            backsounds.forEach(audio => {
                const isPlaying = audio.id === playingAudioId;
                const isPaused = isPlaying ? (activeAudioElement.paused || activeAudioElement.isFadingOut) : true;
                const curVal = isPlaying && activeAudioElement ? activeAudioElement.currentTime : 0;
                
                list.innerHTML += `
                    <div class="list-item ${isPlaying && !isPaused ? 'active' : ''}" id="audio-item-${audio.id}" style="flex-direction:column; align-items:stretch; gap:12px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="item-info">
                                <div style="width:20px;height:20px;color:var(--text-muted);">${icons.audioNote}</div>
                                ${nameHtml('audio', audio, '', audio.id === lastAudioId ? 'color: var(--accent-green)' : '')}
                            </div>
                            <div class="item-actions">
                                <button class="btn-icon ${audio.loop ? 'active' : ''}" onclick="toggleLoop('${audio.id}')" title="Auto Repeat">${icons.repeat}</button>
                                <button class="btn-icon ${isPlaying && !isPaused ? 'active' : ''}" onclick="toggleAudio('${audio.id}', '${audio.url}')" title="${isPaused ? 'Putar' : 'Jeda'}">${isPaused ? icons.play : icons.pause}</button>
                                <button class="btn-icon danger" onclick="deleteAudio('${audio.id}')" title="Hapus">${icons.trash}</button>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; gap:8px; font-size:0.75rem; color:var(--text-muted);">
                            <span class="current-time">${formatTime(curVal)}</span>
                            <input type="range" class="seek-slider" style="flex:1; --p:${audio.duration ? Math.min(1, curVal / audio.duration) : 0};" 
                                   min="0" max="${audio.duration || 0}" step="0.1" value="${curVal}"
                                   onpointerdown="this.isDragging = true" 
                                   onpointerup="const s = this; setTimeout(() => { s.isDragging = false; }, 200)" onpointercancel="this.isDragging = false" 
                                   onchange="seekAudio('${audio.id}', this.value)" 
                                   oninput="setSeekFill(this); document.querySelector('#audio-item-${audio.id} .current-time').innerText = formatTime(this.value)">
                            <span class="total-time">${formatTime(audio.duration || 0)}</span>
                            <span class="remain-time">(-${formatTime((audio.duration || 0) - curVal)})</span>
                        </div>
                    </div>`;
            });
            renameBlurSuspended = false;
            focusRenameInput();
        }

        // ===== Expand / Collapse panel (transisi morph) =====
        // Panel dipindah ke overlay (tempat aslinya diganti placeholder kosong). Tiap elemen di dalamnya dianimasikan
        // dari posisi lama ke posisi baru (FLIP), sementara "cangkang" panel membesar dari tempat asal ke tengah.
        const EXP_MS = 560, EXP_EASE = 'cubic-bezier(.22,.8,.24,1)';
        const EXP_TRACK = '.section-header h3, .section-header .btn, .section-header .exp-btn, .anim-panel, .fade-control-bar, .viz-panel, .list-item';
        const EXP_ICON_ON = `<svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>`;
        const EXP_ICON_OFF = `<svg viewBox="0 0 24 24"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>`;
        const SHELL_ON = { borderRadius: '14px', borderColor: '#475569', boxShadow: '0 30px 80px rgba(0,0,0,0.6)' };
        const SHELL_OFF = { borderRadius: '0px', borderColor: 'rgba(71,85,105,0)', boxShadow: '0 0 0 rgba(0,0,0,0)' };
        let expState = null, expBusy = false;

        const expBox = r => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
        const expRects = sec => { const m = new Map(); sec.querySelectorAll(EXP_TRACK).forEach(el => m.set(el, el.getBoundingClientRect())); return m; };

        function expMorph(sec, first, last, lf, ll) {
            const vis = (r, L) => r.bottom > L.top + 2 && r.top < L.bottom - 2;
            const o = { duration: EXP_MS, easing: EXP_EASE, fill: 'both' };
            const anims = [];
            last.forEach((l, el) => {
                const f = first.get(el);
                const inList = el.classList.contains('list-item');
                let kf;
                if (!f || (inList && (!vis(f, lf) || !vis(l, ll)))) {
                    kf = [{ opacity: 0 }, { opacity: inList && !vis(l, ll) ? 0 : 1 }];
                } else {
                    const flat = el.matches('h3, .btn, .exp-btn');
                    const sc = flat ? '' : ` scale(${f.width / (l.width || 1)}, ${f.height / (l.height || 1)})`;
                    kf = [{ transformOrigin: '0 0', transform: `translate(${f.left - l.left}px, ${f.top - l.top}px)${sc}` },
                          { transformOrigin: '0 0', transform: 'none' }];
                }
                anims.push(el.animate(kf, o));
            });
            const head = sec.querySelector('.section-header');
            if (head) anims.push(head.animate([{ backgroundColor: 'rgba(0,0,0,0)' }, { backgroundColor: 'rgba(0,0,0,0.2)' }], o));
            return anims;
        }

        // Preview proyektor di dalam panel Latar Belakang yang di-expand (rasio mengikuti jendela proyektor)
        function expPreviewAdd(sec) {
            const wrap = document.createElement('div');
            wrap.className = 'exp-preview-area';
            wrap.innerHTML = '<div class="exp-stage" id="exp-preview-stage"><div class="empty-state" id="exp-preview-empty"></div></div>';
            sec.appendChild(wrap);
            syncPreviewAspect();
            expPreviewSync(true, false);
            return wrap;
        }

        function expPreviewSync(instant, wasShowing) {
            const stage = document.getElementById('exp-preview-stage');
            if (!stage) return;
            const empty = document.getElementById('exp-preview-empty');
            const ab = backgrounds.find(b => b.id === activeBgId);
            const src = (ab && !isBlackout) ? ab.url : null;
            stageUpdate(stage, src, instant);
            empty.innerHTML = document.getElementById('preview-empty').innerHTML;
            clearTimeout(stage._t);
            if (src) { empty.style.display = 'none'; return; }
            const d = (!instant && wasShowing && animSettings.out !== 'none') ? animDurationMs() : 0;
            if (d) { empty.style.display = 'none'; stage._t = setTimeout(() => { empty.style.display = 'flex'; }, d); }
            else empty.style.display = 'flex';
        }

        function toggleExpand(kind) { if (expState) collapsePanel(); else expandPanel(kind); }

        function expandPanel(kind) {
            if (expState || expBusy) return;
            const sec = document.getElementById(kind === 'bg' ? 'sec-bg' : 'sec-audio');
            if (!sec) return;
            if (renameState) finishRename(true);
            expBusy = true;
            const r0 = sec.getBoundingClientRect();
            const first = expRects(sec);
            const listEl = sec.querySelector('.item-list');
            const lf = listEl.getBoundingClientRect();

            const ph = document.createElement('div');   // slot asli dibiarkan kosong
            ph.className = 'panel-section exp-placeholder';
            ph.style.cssText = `flex:${getComputedStyle(sec).flex};height:${r0.height}px;`;
            sec.parentNode.insertBefore(ph, sec);

            const ov = document.createElement('div'); ov.className = 'exp-overlay';
            const backdrop = document.createElement('div'); backdrop.className = 'exp-backdrop';
            backdrop.addEventListener('click', () => collapsePanel());
            const shell = document.createElement('div'); shell.className = 'exp-shell';
            ov.append(backdrop, shell, sec);
            document.body.appendChild(ov);

            const det = sec.querySelector('.anim-panel');
            expState = { kind, sec, ph, ov, backdrop, shell, wasOpen: det ? det.open : false, preview: null };
            sec.classList.add('exp-mode', 'exp-' + kind, 'exp-anim');
            if (det) det.open = true;                       // dropdown animasi otomatis terbuka
            vizSide = kind === 'audio';
            if (kind === 'bg') expState.preview = expPreviewAdd(sec);
            const btn = sec.querySelector('.exp-btn');
            btn.innerHTML = EXP_ICON_OFF; btn.title = 'Perkecil'; btn.setAttribute('aria-label', 'Perkecil panel');
            document.documentElement.classList.add('modal-open');   // kunci scroll latar
            document.querySelector('.app').inert = true;            // kunci klik & fokus latar
            drawViz();

            const fr = sec.getBoundingClientRect();
            Object.assign(shell.style, expBox(fr));
            const anims = expMorph(sec, first, expRects(sec), lf, listEl.getBoundingClientRect());
            anims.push(shell.animate([{ ...expBox(r0), ...SHELL_OFF }, { ...expBox(fr), ...SHELL_ON }], { duration: EXP_MS, easing: EXP_EASE, fill: 'both' }));
            anims.push(backdrop.animate([{ opacity: 0 }, { opacity: 1 }], { duration: EXP_MS, easing: 'ease', fill: 'both' }));
            if (expState.preview) anims.push(expState.preview.animate([{ opacity: 0, transform: 'scale(0.88)' }, { opacity: 1, transform: 'none' }], { duration: EXP_MS, easing: EXP_EASE, fill: 'both' }));
            setTimeout(() => {
                anims.forEach(a => a.cancel());
                sec.classList.remove('exp-anim');
                shell.remove();
                expBusy = false;
                drawViz();
                btn.focus();
            }, EXP_MS + 40);
        }

        function collapsePanel() {
            if (!expState || expBusy) return;
            if (renameState) finishRename(true);
            expBusy = true;
            const { kind, sec, ph, ov, backdrop, shell, wasOpen, preview } = expState;
            const listEl = sec.querySelector('.item-list');
            const first = expRects(sec), lf = listEl.getBoundingClientRect();
            const fr = sec.getBoundingClientRect(), r0 = ph.getBoundingClientRect();
            if (preview) { const pr = preview.getBoundingClientRect(); Object.assign(preview.style, { position: 'fixed', margin: '0', ...expBox(pr) }); }

            Object.assign(shell.style, expBox(fr));
            ov.insertBefore(shell, sec);
            sec.classList.remove('exp-mode', 'exp-' + kind);
            sec.classList.add('exp-anim', 'exp-collapsing');
            Object.assign(sec.style, expBox(r0));           // susunan kembali ke bentuk semula, tepat di slot asalnya
            const det = sec.querySelector('.anim-panel');
            if (det) det.open = wasOpen;
            vizSide = false;
            drawViz();
            const btn = sec.querySelector('.exp-btn');
            btn.innerHTML = EXP_ICON_ON; btn.title = 'Perbesar'; btn.setAttribute('aria-label', 'Perbesar panel');

            const anims = expMorph(sec, first, expRects(sec), lf, listEl.getBoundingClientRect());
            anims.push(shell.animate([{ ...expBox(fr), ...SHELL_ON }, { ...expBox(r0), ...SHELL_OFF }], { duration: EXP_MS, easing: EXP_EASE, fill: 'both' }));
            anims.push(backdrop.animate([{ opacity: 1 }, { opacity: 0 }], { duration: EXP_MS, easing: 'ease', fill: 'both' }));
            if (preview) anims.push(preview.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(0.88)' }], { duration: EXP_MS, easing: EXP_EASE, fill: 'both' }));
            setTimeout(() => {
                anims.forEach(a => a.cancel());
                if (preview) preview.remove();
                ph.replaceWith(sec);
                sec.removeAttribute('style');
                sec.className = 'panel-section';
                ov.remove();
                expState = null; expBusy = false;
                document.querySelector('.app').inert = false;
                document.documentElement.classList.remove('modal-open');
                drawViz();
            }, EXP_MS + 40);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape' || !expState || expBusy || renameState) return;
            if (!document.getElementById('confirm-overlay').hidden) return;
            collapsePanel();
        });
    </script>
</body>
